<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Wall Texture Gradient - Modern European Apartment Hallway / Porch -->
    <linearGradient id="wallGradient15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3139" />
      <stop offset="40%" stop-color="#21242B" />
      <stop offset="100%" stop-color="#15171C" />
    </linearGradient>

    <!-- Overhead Sconce / Hallway Spotlight Radial Glow -->
    <radialGradient id="hallLightGlow15" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#FDBA74" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#C2410C" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Overhead Door Fill -->
    <radialGradient id="doorLightGlow15" cx="62%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Anthracite / Oak Apartment Door Gradient -->
    <linearGradient id="oakDoor15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3D45" />
      <stop offset="50%" stop-color="#282A30" />
      <stop offset="100%" stop-color="#191B20" />
    </linearGradient>

    <!-- Door Recessed Panel Fill -->
    <linearGradient id="panelFill15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24262C" />
      <stop offset="100%" stop-color="#16171B" />
    </linearGradient>

    <!-- Solid Cast Brushed Steel / Brass Numerals 15 Gradient -->
    <linearGradient id="metalPlate15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Polished Brass Door Numeral #15 Gradient -->
    <linearGradient id="brassMetallic15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Corrugated Cardboard Parcel Gradient -->
    <linearGradient id="cartonFront15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C27838" />
      <stop offset="60%" stop-color="#9C5921" />
      <stop offset="100%" stop-color="#753C12" />
    </linearGradient>
    <linearGradient id="cartonTop15" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DB924E" />
      <stop offset="100%" stop-color="#BA712F" />
    </linearGradient>
    <linearGradient id="cartonSide15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A4815" />
      <stop offset="100%" stop-color="#5C2D0B" />
    </linearGradient>

    <!-- Realistic Drop Shadows -->
    <filter id="softShadow15" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="crispShadow15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <filter id="plaqueGlow15" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Hallway / Porch Architectural Wall -->
  <rect width="800" height="500" fill="url(#wallGradient15)" />
  <g opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60" stroke="#0F1014" stroke-width="2" />
    <line x1="0" y1="120" x2="800" y2="120" stroke="#0F1014" stroke-width="2" />
    <line x1="0" y1="180" x2="800" y2="180" stroke="#0F1014" stroke-width="2" />
    <line x1="0" y1="240" x2="800" y2="240" stroke="#0F1014" stroke-width="2" />
    <line x1="0" y1="300" x2="800" y2="300" stroke="#0F1014" stroke-width="2" />
    <line x1="0" y1="360" x2="800" y2="360" stroke="#0F1014" stroke-width="2" />
  </g>

  <!-- Floor Tiles / Concrete Ground Floor (where box is left) -->
  <polygon points="0,375 800,375 800,500 0,500" fill="#1C1E24" />
  <rect x="0" y="375" width="800" height="8" fill="#141519" />
  <line x1="0" y1="375" x2="800" y2="375" stroke="#383C48" stroke-width="1.5" />
  <!-- Tile grid lines on floor -->
  <line x1="180" y1="383" x2="130" y2="500" stroke="#2B2E37" stroke-width="1.5" />
  <line x1="420" y1="383" x2="390" y2="500" stroke="#2B2E37" stroke-width="1.5" />
  <line x1="660" y1="383" x2="680" y2="500" stroke="#2B2E37" stroke-width="1.5" />

  <!-- Front Door Casing / Architrave -->
  <rect x="360" y="45" width="310" height="338" fill="#101115" filter="url(#softShadow15)" />
  <rect x="366" y="52" width="298" height="326" fill="#1C1E24" />

  <!-- Door Leaf Frame (Modern Anthracite Architectural Door) -->
  <rect x="374" y="60" width="282" height="318" fill="url(#oakDoor15)" />

  <!-- Minimalist Architectural Recessed Panel Strips -->
  <rect x="390" y="75" width="250" height="5" fill="#121317" opacity="0.8" />
  <rect x="390" y="145" width="250" height="5" fill="#121317" opacity="0.8" />
  <rect x="390" y="215" width="250" height="5" fill="#121317" opacity="0.8" />
  <rect x="390" y="285" width="250" height="5" fill="#121317" opacity="0.8" />
  <rect x="390" y="355" width="250" height="5" fill="#121317" opacity="0.8" />

  <!-- Door Hardware: Brushed Steel Lever Handle & Deadbolt -->
  <circle cx="396" cy="226" r="8" fill="url(#metalPlate15)" filter="url(#crispShadow15)" />
  <rect x="392" y="223" width="26" height="6" rx="3" fill="url(#metalPlate15)" />
  <!-- Keyhole & Wizjer (Peephole) at eye level -->
  <circle cx="515" cy="115" r="5" fill="url(#metalPlate15)" />
  <circle cx="515" cy="115" r="2.5" fill="#0C0D10" />

  <!-- Optical Wizjer / Peephole ring reflection -->
  <circle cx="514" cy="114" r="1" fill="#FFFFFF" opacity="0.7" />

  <!-- Hallway Sconce / Wall Lamp (Left) -->
  <rect x="175" y="75" width="40" height="78" rx="4" fill="#0C0D10" filter="url(#softShadow15)" />
  <rect x="180" y="85" width="30" height="58" rx="2" fill="#FEF08A" opacity="0.95" />
  <line x1="195" y1="75" x2="195" y2="153" stroke="#0C0D10" stroke-width="2" />
  <rect x="165" y="100" width="14" height="16" fill="#0C0D10" />

  <!-- Ambient Light Glow Overlays -->
  <rect width="800" height="500" fill="url(#hallLightGlow15)" pointer-events="none" />
  <rect width="800" height="500" fill="url(#doorLightGlow15)" pointer-events="none" />

  <!-- ======================================================== -->
  <!-- NUMERAL PLAQUE (#15 - FILARECKA 2B / 15)                  -->
  <!-- Centered at x=195, y=180, width=120, height=60            -->
  <!-- ======================================================== -->
  <g id="plaque-15" filter="url(#plaqueGlow15)">
    <!-- Matte Anthracite Architectural Plate -->
    <rect x="135" y="175" width="120" height="64" rx="6" fill="#0A0B0E" stroke="#334155" stroke-width="2" />
    <rect x="139" y="179" width="112" height="56" rx="4" fill="#14161E" />
    
    <!-- Mounting Corner Hex Screws -->
    <circle cx="144" cy="184" r="2" fill="#94A3B8" />
    <circle cx="246" cy="184" r="2" fill="#94A3B8" />
    <circle cx="144" cy="230" r="2" fill="#94A3B8" />
    <circle cx="246" cy="230" r="2" fill="#94A3B8" />

    <!-- Prominent Brass Door Numeral: 15 -->
    <text x="195" y="216" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="34" fill="url(#brassMetallic15)" text-anchor="middle" letter-spacing="2" filter="url(#crispShadow15)">15</text>
    <text x="195" y="228" font-family="'Inter', monospace" font-size="7.5" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">FILARECKA 2B</text>
  </g>

  <!-- Architectural Street & City Sign Below Plaque -->
  <g opacity="0.85">
    <text x="195" y="258" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2">30-110 KRAKÓW</text>
  </g>

  <!-- Door-mounted Cast Numeral 15 on Door Leaf as well -->
  <g id="door-numeral-15" filter="url(#crispShadow15)">
    <rect x="495" y="150" width="40" height="28" rx="3" fill="#16171D" stroke="#383C48" stroke-width="1" />
    <text x="515" y="171" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="url(#brassMetallic15)" text-anchor="middle">15</text>
  </g>

  <!-- Floor Mat (Doormat) -->
  <ellipse cx="510" cy="405" rx="140" ry="26" fill="#171410" stroke="#3D200F" stroke-width="3" />
  <ellipse cx="510" cy="405" rx="134" ry="22" fill="#241B12" />
  <text x="510" y="410" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#78350F" text-anchor="middle" letter-spacing="3">WELCOME</text>

  <!-- ======================================================== -->
  <!-- DELIVERY PARCEL (A CARDBOARD BOX LEFT ON THE FLOOR)       -->
  <!-- Positioned on the floor at the doorstep                  -->
  <!-- ======================================================== -->
  <g id="delivery-box-15" filter="url(#softShadow15)">
    <!-- 3D Isometric Cardboard Box on Floor -->
    <!-- Top Face -->
    <polygon points="450,330 550,330 575,305 475,305" fill="url(#cartonTop15)" />
    <!-- Front Face -->
    <polygon points="450,330 550,330 550,410 450,410" fill="url(#cartonFront15)" />
    <!-- Side Right Face -->
    <polygon points="550,330 575,305 575,385 550,410" fill="url(#cartonSide15)" />

    <!-- Heavy-Duty Brown Packing Tape Seam -->
    <polygon points="492,305 508,305 483,330 467,330" fill="#6B340E" opacity="0.8" />
    <rect x="496" y="330" width="8" height="80" fill="#6B340E" opacity="0.8" />

    <!-- Official Courier Shipping Label -->
    <g filter="url(#crispShadow15)">
      <rect x="466" y="344" width="60" height="48" rx="2" fill="#FFFFFF" />
      <!-- Proofed Header Bar -->
      <rect x="466" y="344" width="60" height="8" rx="2" fill="#0F172A" />
      <text x="496" y="350" font-family="'Inter', monospace" font-size="5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PROOFED COURIER</text>
      
      <!-- Destination Address Text on Shipping Label -->
      <text x="470" y="358" font-family="'Inter', sans-serif" font-size="5" font-weight="800" fill="#0F172A">SHIP TO: FILARECKA 2B / 15</text>
      <text x="470" y="364" font-family="'Inter', sans-serif" font-size="4" font-weight="600" fill="#475569">30-110 KRAKÓW, POLSKA</text>

      <!-- Realistic Barcode Stripes -->
      <g transform="translate(470, 368)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#000" stroke-width="1.8" />
        <line x1="3" y1="0" x2="3" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="6" y1="0" x2="6" y2="12" stroke="#000" stroke-width="1.5" />
        <line x1="9" y1="0" x2="9" y2="12" stroke="#000" stroke-width="2.5" />
        <line x1="13" y1="0" x2="13" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="16" y1="0" x2="16" y2="12" stroke="#000" stroke-width="1.8" />
        <line x1="20" y1="0" x2="20" y2="12" stroke="#000" stroke-width="1.2" />
        <line x1="23" y1="0" x2="23" y2="12" stroke="#000" stroke-width="2.2" />
        <line x1="28" y1="0" x2="28" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="31" y1="0" x2="31" y2="12" stroke="#000" stroke-width="1.5" />
        <line x1="35" y1="0" x2="35" y2="12" stroke="#000" stroke-width="2.8" />
        <line x1="40" y1="0" x2="40" y2="12" stroke="#000" stroke-width="1.2" />
        <line x1="45" y1="0" x2="45" y2="12" stroke="#000" stroke-width="2.0" />
        <text x="25" y="17" font-family="'Inter', monospace" font-size="4" font-weight="700" fill="#000" text-anchor="middle">PK-15110-PL</text>
      </g>
    </g>
  </g>
</svg>