<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Wall Texture Gradient -->
    <linearGradient id="wallGradient744" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24262E" />
      <stop offset="40%" stop-color="#1B1C22" />
      <stop offset="100%" stop-color="#111216" />
    </linearGradient>

    <!-- Porch Sconce Light Radial Glow -->
    <radialGradient id="porchLightGlow744" cx="25%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#FDBA74" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#EA580C" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Overhead Fill Light -->
    <radialGradient id="doorLightGlow744" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cedar Front Door Gradient -->
    <linearGradient id="cedarDoor744" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#583119" />
      <stop offset="50%" stop-color="#3D200F" />
      <stop offset="100%" stop-color="#241208" />
    </linearGradient>

    <!-- Door Recessed Panel Fill -->
    <linearGradient id="panelFill744" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#271308" />
      <stop offset="100%" stop-color="#190B04" />
    </linearGradient>

    <!-- Solid Cast Brass Numerals 744 Gradient -->
    <linearGradient id="brassMetallic744" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Corrugated Cardboard Parcel Gradient -->
    <linearGradient id="cartonFront744" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C27838" />
      <stop offset="60%" stop-color="#9C5921" />
      <stop offset="100%" stop-color="#753C12" />
    </linearGradient>
    <linearGradient id="cartonTop744" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DB924E" />
      <stop offset="100%" stop-color="#BA712F" />
    </linearGradient>
    <linearGradient id="cartonSide744" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A4815" />
      <stop offset="100%" stop-color="#5C2D0B" />
    </linearGradient>

    <!-- Realistic Drop Shadows -->
    <filter id="softShadow744" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="crispShadow744" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <filter id="plaqueGlow744" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Porch Architectural Wall & Siding -->
  <rect width="800" height="500" fill="url(#wallGradient744)" />
  <!-- Horizontal architectural siding planks with ambient bevels -->
  <g opacity="0.6">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#0F1014" stroke-width="3" />
    <line x1="0" y1="51" x2="800" y2="51" stroke="#3D404D" stroke-width="1" />
    <line x1="0" y1="105" x2="800" y2="105" stroke="#0F1014" stroke-width="3" />
    <line x1="0" y1="106" x2="800" y2="106" stroke="#3D404D" stroke-width="1" />
    <line x1="0" y1="160" x2="800" y2="160" stroke="#0F1014" stroke-width="3" />
    <line x1="0" y1="161" x2="800" y2="161" stroke="#3D404D" stroke-width="1" />
    <line x1="0" y1="215" x2="800" y2="215" stroke="#0F1014" stroke-width="3" />
    <line x1="0" y1="216" x2="800" y2="216" stroke="#3D404D" stroke-width="1" />
    <line x1="0" y1="270" x2="800" y2="270" stroke="#0F1014" stroke-width="3" />
    <line x1="0" y1="271" x2="800" y2="271" stroke="#3D404D" stroke-width="1" />
    <line x1="0" y1="325" x2="800" y2="325" stroke="#0F1014" stroke-width="3" />
    <line x1="0" y1="326" x2="800" y2="326" stroke="#3D404D" stroke-width="1" />
  </g>

  <!-- Concrete Porch Ground Floor -->
  <polygon points="0,375 800,375 800,500 0,500" fill="#292B33" />
  <!-- Concrete threshold curb edge -->
  <rect x="0" y="375" width="800" height="8" fill="#1A1B20" />
  <line x1="0" y1="375" x2="800" y2="375" stroke="#3D404D" stroke-width="1.5" />

  <!-- Front Door Casing / Architrave -->
  <rect x="360" y="45" width="310" height="338" fill="#14151A" filter="url(#softShadow744)" />
  <rect x="366" y="52" width="298" height="326" fill="#1F2026" />
  <!-- Door Leaf Frame -->
  <rect x="374" y="60" width="282" height="318" fill="url(#cedarDoor744)" />

  <!-- Recessed Door Molding Panels -->
  <!-- Top Left Panel -->
  <rect x="392" y="78" width="112" height="116" rx="4" fill="url(#panelFill744)" stroke="#1A0D06" stroke-width="3" />
  <rect x="395" y="81" width="106" height="110" rx="3" fill="#2E1609" opacity="0.6" />
  <!-- Top Right Panel -->
  <rect x="526" y="78" width="112" height="116" rx="4" fill="url(#panelFill744)" stroke="#1A0D06" stroke-width="3" />
  <rect x="529" y="81" width="106" height="110" rx="3" fill="#2E1609" opacity="0.6" />
  <!-- Bottom Left Panel -->
  <rect x="392" y="214" width="112" height="144" rx="4" fill="url(#panelFill744)" stroke="#1A0D06" stroke-width="3" />
  <!-- Bottom Right Panel -->
  <rect x="526" y="214" width="112" height="144" rx="4" fill="url(#panelFill744)" stroke="#1A0D06" stroke-width="3" />

  <!-- Solid Brass Lever Handle & Deadbolt -->
  <circle cx="396" cy="226" r="8" fill="url(#brassMetallic744)" filter="url(#crispShadow744)" />
  <rect x="392" y="223" width="26" height="6" rx="3" fill="url(#brassMetallic744)" />
  <!-- Deadbolt Keyhole Plate -->
  <circle cx="396" cy="186" r="6" fill="url(#brassMetallic744)" />
  <circle cx="396" cy="186" r="2" fill="#111216" />

  <!-- Porch Coach Lantern Sconce (Left) -->
  <rect x="175" y="75" width="40" height="78" rx="4" fill="#0C0D10" filter="url(#softShadow744)" />
  <rect x="180" y="85" width="30" height="58" rx="2" fill="#FEF08A" opacity="0.95" />
  <line x1="195" y1="75" x2="195" y2="153" stroke="#0C0D10" stroke-width="2" />
  <!-- Sconce Fixture Mount Arm -->
  <rect x="165" y="100" width="14" height="16" fill="#0C0D10" />

  <!-- Photographic Warm Light Overlays -->
  <rect width="800" height="500" fill="url(#porchLightGlow744)" pointer-events="none" />
  <rect width="800" height="500" fill="url(#doorLightGlow744)" pointer-events="none" />

  <!-- ======================================================== -->
  <!-- HOUSE NUMBER PLAQUE (#744) - EXACT COORDINATES:          -->
  <!-- x=140, y=180, width=110, height=52 (17.5%, 36.0%, 13.75%, 10.4%) -->
  <!-- ======================================================== -->
  <g id="plaque-744" filter="url(#plaqueGlow744)">
    <!-- Heavy Matte Black Anodized Aluminum Plate -->
    <rect x="140" y="180" width="110" height="52" rx="6" fill="#0A0B0E" stroke="#334155" stroke-width="2" />
    <rect x="144" y="184" width="102" height="44" rx="4" fill="#16181F" />
    
    <!-- Mounting Corner Hex Screws -->
    <circle cx="148" cy="188" r="2" fill="#94A3B8" />
    <circle cx="242" cy="188" r="2" fill="#94A3B8" />
    <circle cx="148" cy="224" r="2" fill="#94A3B8" />
    <circle cx="242" cy="224" r="2" fill="#94A3B8" />

    <!-- Solid Cast Brass Numerals: 744 (Centered exactly at x=195) -->
    <text x="195" y="217" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#brassMetallic744)" text-anchor="middle" letter-spacing="3" filter="url(#crispShadow744)">744</text>
  </g>

  <!-- Architectural Street Name Plate Below Plaque -->
  <g opacity="0.8">
    <text x="195" y="246" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">MAPLE STREET</text>
  </g>

  <!-- Woven Coir Welcome Mat -->
  <ellipse cx="510" cy="405" rx="140" ry="26" fill="#171410" stroke="#3D200F" stroke-width="3" />
  <ellipse cx="510" cy="405" rx="134" ry="22" fill="#241B12" />
  <text x="510" y="410" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#78350F" text-anchor="middle" letter-spacing="3">WELCOME</text>

  <!-- ======================================================== -->
  <!-- DELIVERY PARCEL (INTACT, SEALED ON MAT)                   -->
  <!-- x=450, y=305, width=125, height=105 (56.25%, 61.0%, 15.6%, 21.0%) -->
  <!-- ======================================================== -->
  <g id="delivery-box-744" filter="url(#softShadow744)">
    <!-- 3D Isometric Cardboard Box -->
    <!-- Top Face -->
    <polygon points="450,330 550,330 575,305 475,305" fill="url(#cartonTop744)" />
    <!-- Front Face -->
    <polygon points="450,330 550,330 550,410 450,410" fill="url(#cartonFront744)" />
    <!-- Side Right Face -->
    <polygon points="550,330 575,305 575,385 550,410" fill="url(#cartonSide744)" />

    <!-- Heavy-Duty Brown Packing Tape Seam -->
    <polygon points="492,305 508,305 483,330 467,330" fill="#6B340E" opacity="0.8" />
    <rect x="496" y="330" width="8" height="80" fill="#6B340E" opacity="0.8" />

    <!-- Official Courier Shipping Label -->
    <g filter="url(#crispShadow744)">
      <rect x="466" y="344" width="56" height="46" rx="2" fill="#FFFFFF" />
      <!-- Proofed Header Bar -->
      <rect x="466" y="344" width="56" height="8" rx="2" fill="#0F172A" />
      <text x="494" y="350" font-family="'Inter', monospace" font-size="5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PROOFED EXPRESS</text>
      
      <!-- Destination Address Text on Shipping Label -->
      <text x="470" y="358" font-family="'Inter', sans-serif" font-size="5" font-weight="800" fill="#0F172A">SHIP TO: #744 MAPLE</text>
      <text x="470" y="364" font-family="'Inter', sans-serif" font-size="4" font-weight="600" fill="#475569">APT 2B · SAN FRANCISCO, CA</text>

      <!-- Realistic Barcode Stripes -->
      <g transform="translate(470, 368)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#000" stroke-width="1.8" />
        <line x1="3" y1="0" x2="3" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="6" y1="0" x2="6" y2="12" stroke="#000" stroke-width="1.5" />
        <line x1="9" y1="0" x2="9" y2="12" stroke="#000" stroke-width="2.5" />
        <line x1="13" y1="0" x2="13" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="16" y1="0" x2="16" y2="12" stroke="#000" stroke-width="1.8" />
        <line x1="20" y1="0" x2="20" y2="12" stroke="#000" stroke-width="1.2" />
        <line x1="23" y1="0" x2="23" y2="12" stroke="#000" stroke-width="2.2" />
        <line x1="28" y1="0" x2="28" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="31" y1="0" x2="31" y2="12" stroke="#000" stroke-width="1.5" />
        <line x1="35" y1="0" x2="35" y2="12" stroke="#000" stroke-width="2.8" />
        <line x1="40" y1="0" x2="40" y2="12" stroke="#000" stroke-width="1.2" />
        <line x1="44" y1="0" x2="44" y2="12" stroke="#000" stroke-width="2.0" />
        <text x="23" y="17" font-family="'Inter', monospace" font-size="4" font-weight="700" fill="#000" text-anchor="middle">PK-744098-US</text>
      </g>
    </g>
  </g>
</svg>
