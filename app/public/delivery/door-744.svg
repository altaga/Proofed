<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wall744" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3039" />
      <stop offset="100%" stop-color="#1B1C22" />
    </linearGradient>
    <linearGradient id="door744" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2E1B" />
      <stop offset="100%" stop-color="#2B1A0F" />
    </linearGradient>
    <linearGradient id="brass744" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="box744" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="shadow744" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Porch Wall & Siding -->
  <rect width="800" height="500" fill="url(#wall744)" />
  <!-- Siding horizontal groove lines -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#14151A" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#14151A" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#14151A" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#14151A" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#14151A" stroke-width="2" opacity="0.7"/>

  <!-- Porch Concrete Ground Floor -->
  <polygon points="0,380 800,380 800,500 0,500" fill="#33353D" />
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1E1F24" stroke-width="3" />

  <!-- Front Door Frame -->
  <rect x="360" y="50" width="300" height="330" fill="#18191E" filter="url(#shadow744)"/>
  <!-- Front Door Leaf -->
  <rect x="372" y="60" width="276" height="320" fill="url(#door744)" />
  <!-- Door Panels -->
  <rect x="390" y="80" width="105" height="110" fill="#20130B" rx="3" opacity="0.7"/>
  <rect x="525" y="80" width="105" height="110" fill="#20130B" rx="3" opacity="0.7"/>
  <rect x="390" y="210" width="105" height="140" fill="#20130B" rx="3" opacity="0.7"/>
  <rect x="525" y="210" width="105" height="140" fill="#20130B" rx="3" opacity="0.7"/>

  <!-- Brass Door Handle -->
  <circle cx="395" cy="225" r="7" fill="url(#brass744)" filter="url(#shadow744)"/>
  <rect x="391" y="222" width="22" height="6" rx="2" fill="url(#brass744)" />

  <!-- Porch Light Sconce (Left) -->
  <rect x="180" y="90" width="30" height="65" rx="3" fill="#0F1014" />
  <rect x="185" y="100" width="20" height="45" fill="#FEF08A" opacity="0.85" filter="url(#shadow744)"/>

  <!-- House Number Plaque (Target: 744) -->
  <g id="plaque-744" filter="url(#shadow744)">
    <rect x="140" y="180" width="110" height="52" rx="6" fill="#0F1014" stroke="#475569" stroke-width="2"/>
    <rect x="144" y="184" width="102" height="44" rx="4" fill="#1E2028"/>
    <!-- House Numerals 744 in Solid Brass -->
    <text x="195" y="218" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="url(#brass744)" text-anchor="middle" letter-spacing="3">744</text>
  </g>

  <!-- Street Name Tag under plaque -->
  <text x="195" y="246" font-family="'Inter', monospace" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="1">MAPLE STREET</text>

  <!-- Welcome Porch Mat -->
  <ellipse cx="510" cy="405" rx="140" ry="24" fill="#1C1814" stroke="#422006" stroke-width="3"/>
  <text x="510" y="410" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#78350F" text-anchor="middle" letter-spacing="2">WELCOME</text>

  <!-- Delivery Parcel Box (Intact, on Mat) -->
  <g id="delivery-box-744" filter="url(#shadow744)">
    <polygon points="450,330 550,330 575,305 475,305" fill="#D97706" />
    <polygon points="450,330 550,330 550,410 450,410" fill="url(#box744)" />
    <polygon points="550,330 575,305 575,385 550,410" fill="#92400E" />

    <!-- Shipping Label with Barcode -->
    <rect x="465" y="345" width="55" height="42" fill="#FFFFFF" rx="2" />
    <text x="470" y="356" font-family="monospace" font-size="6" font-weight="700" fill="#111827">PROOFED</text>
    <text x="470" y="364" font-family="monospace" font-size="5" fill="#4B5563">TO: #744 MAPLE</text>
    <line x1="470" y1="370" x2="470" y2="382" stroke="#111827" stroke-width="1.5" />
    <line x1="474" y1="370" x2="474" y2="382" stroke="#111827" stroke-width="1" />
    <line x1="477" y1="370" x2="477" y2="382" stroke="#111827" stroke-width="2" />
    <line x1="482" y1="370" x2="482" y2="382" stroke="#111827" stroke-width="1.5" />
    <line x1="486" y1="370" x2="486" y2="382" stroke="#111827" stroke-width="1" />
    <line x1="490" y1="370" x2="490" y2="382" stroke="#111827" stroke-width="2.5" />
    <line x1="495" y1="370" x2="495" y2="382" stroke="#111827" stroke-width="1" />
    <line x1="500" y1="370" x2="500" y2="382" stroke="#111827" stroke-width="2" />
    <line x1="505" y1="370" x2="505" y2="382" stroke="#111827" stroke-width="1.5" />
    <line x1="510" y1="370" x2="510" y2="382" stroke="#111827" stroke-width="2" />
    <text x="470" y="386" font-family="monospace" font-size="4" fill="#111827">PK-744098</text>

    <!-- Brown Packing Tape -->
    <line x1="500" y1="330" x2="500" y2="410" stroke="#78350F" stroke-width="8" opacity="0.4"/>
    <line x1="500" y1="330" x2="525" y2="305" stroke="#78350F" stroke-width="8" opacity="0.4"/>
  </g>
</svg>
