<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wall742" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="door742" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="metal742" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="box742" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="shadow742" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- White Vinyl Siding Wall -->
  <rect width="800" height="500" fill="url(#wall742)" />
  <line x1="0" y1="60" x2="800" y2="60" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>

  <!-- Porch Step & Brick Ground -->
  <polygon points="0,380 800,380 800,500 0,500" fill="#71717A" />
  <rect x="0" y="380" width="800" height="15" fill="#52525B" />

  <!-- Green Front Door Frame -->
  <rect x="360" y="50" width="300" height="330" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" filter="url(#shadow742)"/>
  <!-- Front Door Leaf -->
  <rect x="372" y="60" width="276" height="320" fill="url(#door742)" />
  <!-- Door Inset Panels -->
  <rect x="390" y="80" width="105" height="110" fill="#0A3D1E" rx="3" opacity="0.8"/>
  <rect x="525" y="80" width="105" height="110" fill="#0A3D1E" rx="3" opacity="0.8"/>
  <rect x="390" y="210" width="105" height="140" fill="#0A3D1E" rx="3" opacity="0.8"/>
  <rect x="525" y="210" width="105" height="140" fill="#0A3D1E" rx="3" opacity="0.8"/>

  <!-- Nickel Handle -->
  <circle cx="395" cy="225" r="7" fill="#E2E8F0" filter="url(#shadow742)"/>
  <rect x="391" y="222" width="22" height="6" rx="2" fill="#E2E8F0" />

  <!-- House Number Plaque (MISMATCH: 742) -->
  <g id="plaque-742" filter="url(#shadow742)">
    <rect x="140" y="170" width="120" height="60" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <!-- Large Bold Black House Number 742 -->
    <text x="200" y="215" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#0F172A" text-anchor="middle" letter-spacing="4">742</text>
  </g>

  <!-- Wrong Street Name Sign -->
  <text x="200" y="250" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">EVERGREEN TERRACE</text>
  <rect x="150" y="260" width="100" height="14" rx="2" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="200" y="270" font-family="'Inter', monospace" font-size="7" font-weight="700" fill="#DC2626" text-anchor="middle">MISMATCH: TARGET IS #744</text>

  <!-- Delivery Parcel Box (Sitting on the wrong porch) -->
  <g id="delivery-box-742" filter="url(#shadow742)">
    <polygon points="460,335 560,335 585,310 485,310" fill="#D97706" />
    <polygon points="460,335 560,335 560,415 460,415" fill="url(#box742)" />
    <polygon points="560,335 585,310 585,390 560,415" fill="#92400E" />

    <!-- Label -->
    <rect x="475" y="350" width="55" height="42" fill="#FFFFFF" rx="2" />
    <text x="480" y="361" font-family="monospace" font-size="6" font-weight="700" fill="#111827">PROOFED</text>
    <text x="480" y="369" font-family="monospace" font-size="5" fill="#DC2626" font-weight="700">TO: 744 MAPLE</text>
    <line x1="480" y1="375" x2="480" y2="387" stroke="#111827" stroke-width="1.5" />
    <line x1="484" y1="375" x2="484" y2="387" stroke="#111827" stroke-width="1" />
    <line x1="487" y1="375" x2="487" y2="387" stroke="#111827" stroke-width="2" />
    <line x1="492" y1="375" x2="492" y2="387" stroke="#111827" stroke-width="1.5" />
    <line x1="497" y1="375" x2="497" y2="387" stroke="#111827" stroke-width="2.5" />
    <line x1="502" y1="375" x2="502" y2="387" stroke="#111827" stroke-width="1" />
    <line x1="507" y1="375" x2="507" y2="387" stroke="#111827" stroke-width="2" />
    <text x="480" y="391" font-family="monospace" font-size="4" fill="#111827">PK-744098</text>
  </g>
</svg>
