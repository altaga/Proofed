<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Light Gray / White Vinyl Siding Gradient -->
    <linearGradient id="vinylWall742" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Forest Green Door Gradient -->
    <linearGradient id="forestDoor742" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E4429" />
      <stop offset="50%" stop-color="#072717" />
      <stop offset="100%" stop-color="#03140B" />
    </linearGradient>

    <!-- Brushed Nickel Hardware Gradient -->
    <linearGradient id="nickelHardware742" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Corrugated Cardboard Box Gradients -->
    <linearGradient id="boxFront742" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C27838" />
      <stop offset="60%" stop-color="#9C5921" />
      <stop offset="100%" stop-color="#753C12" />
    </linearGradient>
    <linearGradient id="boxTop742" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DB924E" />
      <stop offset="100%" stop-color="#BA712F" />
    </linearGradient>
    <linearGradient id="boxSide742" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A4815" />
      <stop offset="100%" stop-color="#5C2D0B" />
    </linearGradient>

    <filter id="softShadow742" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="crispShadow742" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Exterior Wall with Clean Vinyl Clapboard Siding -->
  <rect width="800" height="500" fill="url(#vinylWall742)" />
  <g opacity="0.65">
    <line x1="0" y1="45" x2="800" y2="45" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="46" x2="800" y2="46" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="95" x2="800" y2="95" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="96" x2="800" y2="96" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="145" x2="800" y2="145" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="146" x2="800" y2="146" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="195" x2="800" y2="195" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="196" x2="800" y2="196" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="245" x2="800" y2="245" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="246" x2="800" y2="246" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="295" x2="800" y2="295" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="296" x2="800" y2="296" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="345" x2="800" y2="345" stroke="#94A3B8" stroke-width="2" />
    <line x1="0" y1="346" x2="800" y2="346" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Poured Concrete Porch Step Floor -->
  <polygon points="0,375 800,375 800,500 0,500" fill="#475569" />
  <rect x="0" y="375" width="800" height="7" fill="#334155" />
  <line x1="0" y1="375" x2="800" y2="375" stroke="#64748B" stroke-width="1.5" />

  <!-- Modern Front Door Casing (White Molded PVC) -->
  <rect x="360" y="45" width="310" height="338" fill="#F1F5F9" filter="url(#softShadow742)" />
  <rect x="366" y="52" width="298" height="326" fill="#E2E8F0" />
  <!-- Forest Green Door Leaf -->
  <rect x="374" y="60" width="282" height="318" fill="url(#forestDoor742)" />

  <!-- Recessed Door Molding Panels -->
  <rect x="392" y="78" width="112" height="116" rx="4" fill="#04180E" stroke="#020E08" stroke-width="2.5" />
  <rect x="526" y="78" width="112" height="116" rx="4" fill="#04180E" stroke="#020E08" stroke-width="2.5" />
  <rect x="392" y="214" width="112" height="144" rx="4" fill="#04180E" stroke="#020E08" stroke-width="2.5" />
  <rect x="526" y="214" width="112" height="144" rx="4" fill="#04180E" stroke="#020E08" stroke-width="2.5" />

  <!-- Brushed Nickel Lever Handle & Deadbolt -->
  <circle cx="396" cy="226" r="8" fill="url(#nickelHardware742)" filter="url(#crispShadow742)" />
  <rect x="392" y="223" width="26" height="6" rx="3" fill="url(#nickelHardware742)" />
  <circle cx="396" cy="186" r="6" fill="url(#nickelHardware742)" />
  <circle cx="396" cy="186" r="2" fill="#04180E" />

  <!-- Modern Frosted Glass Porch Light -->
  <rect x="175" y="75" width="36" height="74" rx="3" fill="#334155" filter="url(#softShadow742)" />
  <rect x="180" y="83" width="26" height="56" rx="2" fill="#FEF9C3" opacity="0.9" />

  <!-- ======================================================== -->
  <!-- HOUSE NUMBER PLAQUE (#742) - EXACT COORDINATES:          -->
  <!-- x=140, y=170, width=120, height=60 (17.5%, 34.0%, 15.0%, 12.0%) -->
  <!-- ======================================================== -->
  <g id="plaque-742" filter="url(#softShadow742)">
    <!-- White Acrylic Plaque with Black Border -->
    <rect x="140" y="170" width="120" height="60" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <rect x="144" y="174" width="112" height="52" rx="3" fill="#F8FAFC" />
    
    <circle cx="148" cy="178" r="2" fill="#64748B" />
    <circle cx="252" cy="178" r="2" fill="#64748B" />
    <circle cx="148" cy="222" r="2" fill="#64748B" />
    <circle cx="252" cy="222" r="2" fill="#64748B" />

    <!-- Bold Black Number 742 (Centered at x=200) -->
    <text x="200" y="215" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="34" fill="#0F172A" text-anchor="middle" letter-spacing="4">742</text>
  </g>

  <!-- Clean Street Name: EVERGREEN TERRACE (Authentic, no graffiti) -->
  <g opacity="0.85">
    <text x="200" y="254" font-family="'Inter', monospace" font-size="9" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="1.5">EVERGREEN TERRACE</text>
  </g>

  <!-- ======================================================== -->
  <!-- DELIVERY PARCEL (DROPPED AT WRONG HOUSE #742)            -->
  <!-- x=460, y=310, width=125, height=105 (57.5%, 62.0%, 15.6%, 21.0%) -->
  <!-- ======================================================== -->
  <g id="delivery-box-742" filter="url(#softShadow742)">
    <!-- Top Face -->
    <polygon points="460,335 560,335 585,310 485,310" fill="url(#boxTop742)" />
    <!-- Front Face -->
    <polygon points="460,335 560,335 560,415 460,415" fill="url(#boxFront742)" />
    <!-- Side Right Face -->
    <polygon points="560,335 585,310 585,390 560,415" fill="url(#boxSide742)" />

    <!-- Brown Tape -->
    <polygon points="502,310 518,310 493,335 477,335" fill="#6B340E" opacity="0.8" />
    <rect x="506" y="335" width="8" height="80" fill="#6B340E" opacity="0.8" />

    <!-- Courier Label showing recipient address: #744 MAPLE -->
    <g filter="url(#crispShadow742)">
      <rect x="476" y="349" width="56" height="46" rx="2" fill="#FFFFFF" />
      <rect x="476" y="349" width="56" height="8" rx="2" fill="#0F172A" />
      <text x="504" y="355" font-family="'Inter', monospace" font-size="5" font-weight="800" fill="#FFFFFF" text-anchor="middle">PROOFED EXPRESS</text>
      
      <text x="480" y="363" font-family="'Inter', sans-serif" font-size="5" font-weight="800" fill="#0F172A">SHIP TO: #744 MAPLE</text>
      <text x="480" y="369" font-family="'Inter', sans-serif" font-size="4" font-weight="600" fill="#475569">APT 2B · SAN FRANCISCO, CA</text>

      <g transform="translate(480, 373)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#000" stroke-width="1.8" />
        <line x1="3" y1="0" x2="3" y2="12" stroke="#000" stroke-width="0.8" />
        <line x1="6" y1="0" x2="6" y2="12" stroke="#000" stroke-width="1.5" />
        <line x1="9" y1="0" x2="9" y2="12" stroke="#000" stroke-width="2.5" />
        <line x1="14" y1="0" x2="14" y2="12" stroke="#000" stroke-width="1.0" />
        <line x1="18" y1="0" x2="18" y2="12" stroke="#000" stroke-width="2.0" />
        <line x1="22" y1="0" x2="22" y2="12" stroke="#000" stroke-width="1.2" />
        <line x1="26" y1="0" x2="26" y2="12" stroke="#000" stroke-width="2.2" />
        <line x1="31" y1="0" x2="31" y2="12" stroke="#000" stroke-width="1.5" />
        <line x1="36" y1="0" x2="36" y2="12" stroke="#000" stroke-width="2.8" />
        <line x1="42" y1="0" x2="42" y2="12" stroke="#000" stroke-width="1.8" />
        <text x="23" y="17" font-family="'Inter', monospace" font-size="4" font-weight="700" fill="#000" text-anchor="middle">PK-744098-US</text>
      </g>
    </g>
  </g>
</svg>
