<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGradient13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A342D" />
      <stop offset="50%" stop-color="#26221D" />
      <stop offset="100%" stop-color="#171512" />
    </linearGradient>
    <radialGradient id="lightGlow13" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#FDBA74" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="doorPaint13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brassNum13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="boxFront13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C27838" />
      <stop offset="100%" stop-color="#753C12" />
    </linearGradient>
    <linearGradient id="boxTop13" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DB924E" />
      <stop offset="100%" stop-color="#BA712F" />
    </linearGradient>
    <linearGradient id="boxSide13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A4815" />
      <stop offset="100%" stop-color="#5C2D0B" />
    </linearGradient>
    <filter id="softShadow13" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="crispShadow13" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#wallGradient13)" />
  <polygon points="0,375 800,375 800,500 0,500" fill="#1C1E24" />
  <rect x="0" y="375" width="800" height="8" fill="#141519" />

  <!-- Door Casing -->
  <rect x="360" y="45" width="310" height="338" fill="#0F172A" filter="url(#softShadow13)" />
  <rect x="374" y="60" width="282" height="318" fill="url(#doorPaint13)" />

  <!-- Hardware -->
  <circle cx="396" cy="226" r="8" fill="#CBD5E1" filter="url(#crispShadow13)" />
  <rect x="392" y="223" width="26" height="6" rx="3" fill="#CBD5E1" />
  <circle cx="515" cy="115" r="5" fill="#CBD5E1" />

  <!-- Sconce -->
  <rect x="175" y="75" width="40" height="78" rx="4" fill="#0C0D10" filter="url(#softShadow13)" />
  <rect x="180" y="85" width="30" height="58" rx="2" fill="#FEF08A" opacity="0.9" />

  <rect width="800" height="500" fill="url(#lightGlow13)" pointer-events="none" />

  <!-- WRONG DOOR PLAQUE (#14 instead of #15) -->
  <g id="plaque-13" filter="url(#crispShadow13)">
    <rect x="135" y="175" width="120" height="64" rx="6" fill="#0A0B0E" stroke="#E11D48" stroke-width="2" />
    <rect x="139" y="179" width="112" height="56" rx="4" fill="#14161E" />
    <text x="195" y="216" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="url(#brassNum13)" text-anchor="middle" letter-spacing="2">14</text>
    <text x="195" y="228" font-family="'Inter', monospace" font-size="7.5" font-weight="700" fill="#FDA4AF" text-anchor="middle" letter-spacing="1">FILARECKA 2B</text>
  </g>
  <text x="195" y="258" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2">30-110 KRAKÓW</text>

  <!-- Door-mounted Numeral 14 -->
  <g id="door-numeral-13" filter="url(#crispShadow13)">
    <rect x="495" y="150" width="40" height="28" rx="3" fill="#0F172A" stroke="#E11D48" stroke-width="1.5" />
    <text x="515" y="171" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="url(#brassNum13)" text-anchor="middle">14</text>
  </g>

  <!-- Misdelivered Box on Floor -->
  <g id="delivery-box-13" filter="url(#softShadow13)">
    <polygon points="450,330 550,330 575,305 475,305" fill="url(#boxTop13)" />
    <polygon points="450,330 550,330 550,410 450,410" fill="url(#boxFront13)" />
    <polygon points="550,330 575,305 575,385 550,410" fill="url(#boxSide13)" />

    <!-- Label specifically says destination was #15 -->
    <g filter="url(#crispShadow13)">
      <rect x="466" y="344" width="60" height="48" rx="2" fill="#FFFFFF" />
      <rect x="466" y="344" width="60" height="8" rx="2" fill="#0F172A" />
      <text x="496" y="350" font-family="'Inter', monospace" font-size="5" font-weight="800" fill="#FFFFFF" text-anchor="middle">PROOFED COURIER</text>
      <text x="470" y="358" font-family="'Inter', sans-serif" font-size="5" font-weight="800" fill="#E11D48">SHIP TO: FILARECKA 2B / 15</text>
      <text x="470" y="364" font-family="'Inter', sans-serif" font-size="4" font-weight="600" fill="#475569">30-110 KRAKÓW, POLSKA</text>
    </g>
  </g>
</svg>