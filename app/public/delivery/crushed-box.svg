<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallCrush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
    <linearGradient id="concreteCrush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52525B" />
      <stop offset="100%" stop-color="#3F3F46" />
    </linearGradient>
    <linearGradient id="boxDented" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#5A2308" />
    </linearGradient>
    <filter id="shadowCrush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Stone Porch Wall -->
  <rect width="800" height="500" fill="url(#wallCrush)" />
  <line x1="0" y1="100" x2="800" y2="100" stroke="#18181B" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#18181B" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#18181B" stroke-width="2" opacity="0.5"/>

  <!-- Concrete Steps Floor -->
  <polygon points="0,350 800,350 800,500 0,500" fill="url(#concreteCrush)" />
  <rect x="0" y="350" width="800" height="20" fill="#18181B" opacity="0.4"/>
  <!-- Concrete surface cracks -->
  <path d="M 220 380 L 260 410 L 290 405 L 340 440" stroke="#27272A" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- House Plaque (744) in background -->
  <g id="plaque-crushed" filter="url(#shadowCrush)">
    <rect x="120" y="140" width="100" height="48" rx="4" fill="#18181B" stroke="#71717A" stroke-width="2"/>
    <text x="170" y="174" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#E4E4E7" text-anchor="middle" letter-spacing="3">744</text>
  </g>

  <!-- Door in background -->
  <rect x="480" y="40" width="240" height="310" fill="#18181B" opacity="0.6" />

  <!-- Crushed, Dented, Ruptured Parcel Box (Center Stage) -->
  <g id="crushed-box" filter="url(#shadowCrush)">
    <!-- Main Dented Cardboard Body (irregular polygon simulating heavy crushing) -->
    <polygon points="310,310 430,335 450,290 340,270" fill="#B45309" />
    <polygon points="310,310 430,335 410,430 280,395" fill="url(#boxDented)" />
    <polygon points="430,335 450,290 490,370 410,430" fill="#78350F" />

    <!-- Torn Cardboard Flap (creased upwards) -->
    <polygon points="340,270 380,240 410,270 370,285" fill="#D97706" stroke="#451A03" stroke-width="1.5"/>

    <!-- Punctured Hole / Tear showing darkness inside -->
    <polygon points="330,340 370,355 355,385 320,365" fill="#1C1917" stroke="#451A03" stroke-width="1.5"/>

    <!-- Broken Packing Tape (frayed, split in two) -->
    <path d="M 370 325 L 365 350" stroke="#78350F" stroke-width="10" stroke-dasharray="8,4" opacity="0.8"/>
    <path d="M 358 375 L 350 415" stroke="#78350F" stroke-width="10" opacity="0.8"/>

    <!-- Crushed Warning Label (Wrinkled) -->
    <g transform="translate(320, 360) rotate(12)">
      <rect x="0" y="0" width="60" height="35" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" rx="2"/>
      <text x="30" y="14" font-family="monospace" font-size="7" font-weight="900" fill="#DC2626" text-anchor="middle">FRAGILE</text>
      <text x="30" y="24" font-family="monospace" font-size="6" font-weight="700" fill="#991B1B" text-anchor="middle">TORN / RUPTURED</text>
    </g>

    <!-- Impact Sensor Badge (Tripped Red) -->
    <g transform="translate(425, 365)">
      <circle cx="12" cy="12" r="12" fill="#7F1D1D" stroke="#EF4444" stroke-width="2" />
      <circle cx="12" cy="12" r="6" fill="#EF4444" />
      <text x="12" y="32" font-family="monospace" font-size="6" font-weight="700" fill="#FCA5A5" text-anchor="middle">&gt;4.5G TRIP</text>
    </g>
  </g>
</svg>
