<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Weathered Concrete Porch Texture -->
    <linearGradient id="wallCrushReal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33353D" />
      <stop offset="60%" stop-color="#24252B" />
      <stop offset="100%" stop-color="#18191E" />
    </linearGradient>

    <!-- Porch Concrete Steps Floor -->
    <linearGradient id="concreteSteps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4D57" />
      <stop offset="40%" stop-color="#383A42" />
      <stop offset="100%" stop-color="#222329" />
    </linearGradient>

    <!-- Cardboard Creased Surfaces Gradients -->
    <linearGradient id="cardboardCrushedFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#92400E" />
      <stop offset="70%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="cardboardCreaseDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1703" />
      <stop offset="100%" stop-color="#1A0A01" />
    </linearGradient>
    <linearGradient id="cardboardTornFlap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <filter id="shadowCrushReal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="crispShadowCrush" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Dark Stone Exterior Porch Wall -->
  <rect width="800" height="500" fill="url(#wallCrushReal)" />
  <g opacity="0.45">
    <line x1="0" y1="65" x2="800" y2="65" stroke="#18191E" stroke-width="2" />
    <line x1="0" y1="130" x2="800" y2="130" stroke="#18191E" stroke-width="2" />
    <line x1="0" y1="195" x2="800" y2="195" stroke="#18191E" stroke-width="2" />
    <line x1="0" y1="260" x2="800" y2="260" stroke="#18191E" stroke-width="2" />
    <line x1="0" y1="325" x2="800" y2="325" stroke="#18191E" stroke-width="2" />
  </g>

  <!-- Poured Concrete Porch Landing Step -->
  <polygon points="0,345 800,345 800,500 0,500" fill="url(#concreteSteps)" />
  <rect x="0" y="345" width="800" height="12" fill="#1C1D22" />
  <line x1="0" y1="345" x2="800" y2="345" stroke="#525662" stroke-width="2" />

  <!-- Concrete floor surface seams & texture lines -->
  <path d="M 180 395 L 240 435 L 290 428 L 360 480" stroke="#1F2026" stroke-width="2.5" fill="none" opacity="0.75" />

  <!-- Background Front Door (#744 Residence) -->
  <rect x="470" y="35" width="260" height="320" fill="#141519" opacity="0.85" filter="url(#shadowCrushReal)" />
  <rect x="480" y="45" width="240" height="300" fill="#24130A" opacity="0.85" />
  <!-- Door knob in shadow -->
  <circle cx="496" cy="205" r="7" fill="#854D0E" opacity="0.6" />

  <!-- ======================================================== -->
  <!-- HOUSE NUMBER PLAQUE (#744) - EXACT COORDINATES:          -->
  <!-- x=120, y=140, width=100, height=48 (15.0%, 28.0%, 12.5%, 9.6%) -->
  <!-- ======================================================== -->
  <g id="plaque-crushed" filter="url(#crispShadowCrush)">
    <rect x="120" y="140" width="100" height="48" rx="5" fill="#111216" stroke="#475569" stroke-width="2" />
    <rect x="124" y="144" width="92" height="40" rx="3" fill="#1E2028" />
    <!-- Bold Metallic Numerals 744 (Centered at x=170) -->
    <text x="170" y="174" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="24" fill="#F3F4F6" text-anchor="middle" letter-spacing="3">744</text>
  </g>
  <text x="170" y="202" font-family="'Inter', monospace" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">MAPLE STREET</text>

  <!-- ======================================================== -->
  <!-- CRUSHED, COMPROMISED DELIVERY PARCEL                     -->
  <!-- x=280, y=240, width=220, height=190 (35.0%, 48.0%, 27.5%, 38.0%) -->
  <!-- ======================================================== -->
  <g id="crushed-carton-assembly" filter="url(#shadowCrushReal)">
    <!-- Base Dented Box Body (Deep impact creases & dented geometry) -->
    <!-- Crumpled Top Face -->
    <polygon points="310,310 435,328 470,285 355,260" fill="url(#cardboardTornFlap)" />
    <!-- Crushed Crease Line -->
    <path d="M 355 260 L 395 305 L 435 328" stroke="#3A1703" stroke-width="3" fill="none" />

    <!-- Main Front Dented Hull -->
    <polygon points="310,310 435,328 420,428 285,395" fill="url(#cardboardCrushedFront)" />
    <!-- Crumpled Right Side Flank -->
    <polygon points="435,328 470,285 498,365 420,428" fill="#582408" />

    <!-- Ruptured Accordion Fold Valley in Center of Front -->
    <polygon points="345,315 390,345 375,415 325,390" fill="url(#cardboardCreaseDark)" opacity="0.65" />
    <line x1="390" y1="345" x2="375" y2="415" stroke="#1A0A01" stroke-width="3" />

    <!-- Torn Cardboard Top Flap Creased Upwards (Damage Breach) -->
    <polygon points="350,265 385,235 425,265 375,285" fill="#D97706" stroke="#451A03" stroke-width="2" />
    <!-- Jagged Cardboard Paper Tear Edge -->
    <path d="M 385 235 L 392 245 L 400 240 L 412 255 L 425 265" stroke="#FDE68A" stroke-width="1.5" fill="none" />

    <!-- Dark Punctured Hole (Shows dark void inside box) -->
    <polygon points="332,342 368,354 354,382 322,365" fill="#0C0A09" stroke="#3B1503" stroke-width="2" />

    <!-- Broken / Snapped Packing Tape (frayed in two) -->
    <path d="M 372 312 L 366 342" stroke="#78350F" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    <path d="M 358 376 L 348 420" stroke="#78350F" stroke-width="10" stroke-linecap="round" opacity="0.85" />

    <!-- Wrinkled & Torn Courier Shipping Label -->
    <g transform="translate(325, 362) rotate(10)" filter="url(#crispShadowCrush)">
      <polygon points="0,0 58,5 52,38 3,32" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
      <text x="28" y="9" font-family="'Inter', monospace" font-size="5" font-weight="900" fill="#991B1B" text-anchor="middle">PROOFED LOGISTICS</text>
      <text x="28" y="16" font-family="'Inter', sans-serif" font-size="4" font-weight="800" fill="#111827" text-anchor="middle">DEST: #744 MAPLE ST</text>
      
      <!-- Wrinkle Crease across label -->
      <line x1="12" y1="2" x2="40" y2="34" stroke="#B91C1C" stroke-width="1" stroke-dasharray="3,1" />

      <!-- Transit Impact Sensor Badge (Tripped Red >4.5G) -->
      <g transform="translate(40, 24)">
        <circle cx="0" cy="0" r="6" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
        <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
        <text x="0" y="9" font-family="'Inter', monospace" font-size="3" font-weight="900" fill="#7F1D1D" text-anchor="middle">>4.5G TRIP</text>
      </g>
    </g>
  </g>
</svg>
